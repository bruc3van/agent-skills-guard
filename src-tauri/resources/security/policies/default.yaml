# 默认扫描策略
# 适用于一般桌面应用场景，平衡安全检测与误报控制
# 定位：Agent Skill 安装前安全风险扫描器
# 默认聚焦可执行风险、注入攻击、网络外联和敏感数据风险
# 对不可审计内容显式降低信任；结构合规作为辅助信息，不主导安全结论

policy_name: default
policy_version: "1.0"
preset_base: balanced

# 禁用的规则（空列表表示不禁用任何规则）
disabled_rules: []

# 严重度覆盖（示例，可按需调整）
severity_overrides: []

# 硬触发覆盖（将规则强制设为 hard_trigger 或取消 hard_trigger）
# 以下规则在默认策略下降为 High 仍计入评分，但不阻断安装
hard_trigger_overrides:
  - rule_id: COMMAND_INJECTION_JS_FUNCTION_CONSTRUCTOR
    hard_trigger: false
    reason: "Function 构造器在模板引擎等合法场景中有使用，降为 High 仍计入评分"
  - rule_id: SVG_EMBEDDED_SCRIPT
    hard_trigger: false
    reason: "SVG 脚本在资源展示场景中可能合法，降为 High 仍计入评分"
  - rule_id: PDF_EMBEDDED_JAVASCRIPT
    hard_trigger: false
    reason: "PDF 嵌入 JS 在文档展示场景中可能合法，降为 High 仍计入评分"

# 计入安全分的 FindingKind；默认不让结构合规噪音影响安全分
score_kinds:
  - Security
  - Auditability

# 是否启用严格结构校验（默认关闭；结构合规 finding 不计入安全分）
strict_structure_enabled: false

# 文件限制
file_limits:
  max_files: 2000
  max_depth: 20
  max_scan_file_size_bytes: 2097152  # 2 MiB

# 文件分类
file_classification:
  inert_extensions:
    - ".ttf"
    - ".otf"
    - ".woff"
    - ".woff2"
    - ".eot"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".webp"
    - ".avif"
    - ".bmp"
    - ".ico"
    - ".icns"
    - ".tif"
    - ".tiff"
    - ".heic"
    - ".heif"
    - ".pyc"
    - ".pyo"
    - ".db"
    - ".sqlite"
    - ".sqlite3"

# 规则作用域
rule_scoping:
  doc_path_indicators:
    - "doc"
    - "docs"
    - "references"
    - "examples"
    - "tutorials"
    - "guides"
    - "test"
    - "tests"
    - "fixtures"
    - "samples"
    - "demo"
    - "skills"
  # skip_in_docs: 这些规则在文档路径中直接跳过（docs/、examples/、test/ 等目录）
  # 适用场景：仅示例/教程中出现的低风险模式
  skip_in_docs:
    - "CURL_POST"
    - "PY_EVAL"
    - "TOOL_ABUSE_SYSTEM_PACKAGE_INSTALL"

# Pipeline 分析
pipeline:
  # 已知安装器域名：命中时把「下载→执行」类发现降级为 Medium，而非豁免。
  #
  # 收录标准：该域名下的内容必须完全由可信方控制。匹配为 hostname 精确或子域匹配，
  # 因此写 "foo.com" 等于信任 "*.foo.com" 的一切。
  #
  # 不得收录允许任意用户发布内容的域：raw.githubusercontent.com、gist.github.com、
  # *.vercel.app、包 registry（npmjs.com）、第三方模块仓库（deno.land/x）等。
  # deno.land 与 npmjs.com 曾因此被移除。
  known_installer_domains:
    - "sh.rustup.rs"
    - "astral.sh"
    - "bun.sh"
    - "get.pnpm.io"
    - "nodejs.org"
    - "pip.pypa.io"
    - "brew.sh"
    - "curl.se"
    - "git-scm.com"
    - "go.dev"
    - "rustup.rs"
    - "install.python-poetry.org"
    - "rye.astral.sh"
    - "mise.jdx.dev"

# 凭据检测
credentials:
  known_test_values:
    - "sk_test_"
    - "pk_test_"
    - "tok_test_"
    - "your-api-key-here"
    - "example-token"
    - "changeme"
    - "password123"

# Finding 输出
finding_output:
  dedupe: true

# 结构校验
strict_structure:
  allowed_extensions:
    - ".md"
    - ".py"
    - ".sh"
    - ".json"
    - ".yaml"
    - ".yml"
    - ".txt"
    - ".js"
    - ".ts"
    - ".html"
    - ".css"
    - ".svg"
    - ".xml"
    - ".xsd"
    - ".toml"
    - ".cfg"
    - ".ini"
    - ".env"
    - ".gitignore"
    - ".gitattributes"
    - ".editorconfig"
    - ".prettierrc"
    - ".eslintrc"
  allowed_subdirs:
    - "scripts"
    - "references"
    - "assets"
    - "templates"
    - "data"
    - "config"
    - "src"
    - "lib"

# 触发/描述质量
trigger:
  min_description_length: 10
  keyword_baiting_threshold: 8
